<!DOCTYPE html>

    <link rel="stylesheet" href="style.css">

                            </div>

                                        <li><a href="#">Products</a></li>

                        </div>
                    </div>
                </div>
            </div>
        </section>

    <main>

        <section id="main-band" class="band">
            <div class="band-wrapper">
                <div class="band-flex-container">
                        <img src="logos/Alibaba.svg" alt="">
